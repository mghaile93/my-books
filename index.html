<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>My Books</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171714;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom))}.screen{display:none}.screen.on{display:block}h1{font-family:Georgia,serif;font-size:36px;margin:12px 0 22px}.bar{display:flex;align-items:center;justify-content:space-between}.bar h1{margin:12px 0}.search{background:#f1f1ef;border-radius:14px;padding:12px 14px;color:#777;margin-bottom:25px}.search input{border:0;background:transparent;outline:0;width:90%;font-size:15px}.sec{margin:28px 0}.head{display:flex;justify-content:space-between;align-items:center}.head h2{font:700 22px Georgia;margin:0 0 14px}.link,.back{border:0;background:none;color:#6b5720}.row,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.row{overflow:hidden}.book{min-width:0}.cover{width:100%;aspect-ratio:2/3;border-radius:7px;object-fit:cover;background:#ece9e2;box-shadow:0 5px 15px #0002}.bt{font-size:11px;font-weight:700;margin-top:6px;line-height:1.2}.ba{font-size:9px;color:#777;margin-top:2px}.cats{display:grid;gap:14px}.cat{height:126px;border:0;border-radius:18px;overflow:hidden;position:relative;text-align:left;color:white;padding:0;background:#333}.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}.cat:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0009,transparent)}.ct{position:absolute;z-index:2;left:18px;bottom:18px}.ct b{display:block;font:700 21px Georgia;max-width:300px}.ct small{font-size:12px}.arr{position:absolute;z-index:2;right:18px;top:48px;font-size:28px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid #ddd;padding:9px 5px calc(8px + env(safe-area-inset-bottom));z-index:9}.nav button{border:0;background:none;color:#666;font-size:18px}.nav small{display:block;font-size:10px;margin-top:3px}.hero{text-align:center;background:#f4efe6;margin:0 -20px;padding:22px 20px 25px}.hero .cover{width:170px}.hero h2{font:700 28px Georgia;margin:16px 0 4px}.muted{color:#777}.stars{font-size:27px;color:#d89e00;margin:12px}.status{display:flex;justify-content:center;gap:7px}.pill{border:1px solid #ddd;background:white;border-radius:18px;padding:8px 12px}.pill.on{background:#1d3e35;color:white}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border-bottom:1px solid #ddd}.tabs button{border:0;background:none;padding:12px}.tabs .on{border-bottom:2px solid #1d3e35;font-weight:700}.copy{line-height:1.55}.result{display:grid;grid-template-columns:72px 1fr;gap:13px;padding:12px 0;border-bottom:1px solid #eee}.result .cover{width:72px}.owned{display:inline-block;background:#e3eee8;color:#265a45;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:800;margin-top:6px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.mode button{border:0;border-radius:15px;background:#f3f1ed;padding:16px 4px;font-weight:650}.field{margin:13px 0}.field label{font-size:11px;color:#777;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;background:#fff;font-size:16px}.primary{width:100%;border:0;border-radius:14px;background:#111;color:white;padding:15px;font-weight:700;margin:7px 0}.menu{background:#faf9f6;border-radius:16px;padding:4px 16px;margin-bottom:15px}.mrow{padding:16px 0;border-bottom:1px solid #e6e3dc}.mrow:last-child{border:0}.details{background:#faf9f6;border-radius:14px;overflow:hidden}.drow{display:grid;grid-template-columns:110px 1fr;padding:13px;border-bottom:1px solid #e5e2dc;font-size:13px}.scanner{height:500px;background:#222;position:relative;margin:0 -20px}.scanframe{position:absolute;width:280px;height:170px;border:2px solid white;border-radius:18px;left:50%;top:42%;transform:translate(-50%,-50%)}.scanframe:after{content:'';position:absolute;left:12px;right:12px;top:50%;height:2px;background:#6fe2bc}</style></head><body><main class="app"><section id="home" class="screen on"><div class="bar"><h1>My Books</h1><button class="pill" onclick="show('add')">＋</button></div><div class="search" onclick="show('search')">⌕ &nbsp; Search by title, author, genre or ISBN</div><div id="homebody"></div></section><section id="browse" class="screen"><h1>Browse</h1><div id="cats" class="cats"></div></section><section id="category" class="screen"><button class="back" onclick="show('browse')">‹ Browse</button><h1 id="catTitle"></h1><div id="catGrid" class="grid"></div></section><section id="search" class="screen"><h1>Search</h1><div class="search">⌕ <input id="q" autofocus placeholder="Search My Books" oninput="renderSearch()"></div><div id="results"></div></section><section id="detail" class="screen"><button class="back" onclick="show('home')">‹ Back</button><div id="detailbody"></div></section><section id="add" class="screen"><h1>Add Book</h1><div class="mode"><button onclick="show('scanner')">▣<br>Scan ISBN</button><button>⌕<br>Search</button><button>＋<br>Manual</button></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Author</label><input id="na"></div><div class="field"><label>Genre / category</label><input id="ng"></div><div class="field"><label>ISBN</label><input id="ni"></div><button class="primary" onclick="addBook()">Add to My Books</button></section><section id="scanner" class="screen"><button class="back" onclick="show('add')">‹ Add Book</button><h1>Scan Barcode</h1><div class="scanner"><div class="scanframe"></div></div></section><section id="more" class="screen"><h1>More</h1><div class="menu"><div class="mrow"><b>Library</b><div class="muted">Manage your personal collection</div></div><div class="mrow"><b>Backup & Restore</b><div class="muted">Keep a copy of your library</div></div><div class="mrow"><b>Settings</b><div class="muted">My Books preferences</div></div></div><button class="primary" onclick="backup()">Backup Library</button><label class="primary" style="display:block;text-align:center">Restore Library<input hidden type="file" accept="application/json" onchange="restore(this)"></label><p class="muted">Your library stays on this device. No account or subscription.</p></section></main><nav class="nav"><button onclick="show('home')">⌂<small>Home</small></button><button onclick="show('browse')">▦<small>Browse</small></button><button onclick="show('search')">⌕<small>Search</small></button><button onclick="show('add')">＋<small>Add</small></button><button onclick="show('more')">•••<small>More</small></button></nav><script>const D=[["Atomic Habits","James Clear","Psychology & Self-Development"],["The Laws of Human Nature","Robert Greene","Psychology & Self-Development"],["Emotional Intelligence","Daniel Goleman","Psychology & Self-Development"],["Social Intelligence","Daniel Goleman","Psychology & Self-Development"],["The Untethered Soul","Michael A. Singer","Psychology & Self-Development"],["The Power of Now","Eckhart Tolle","Psychology & Self-Development"],["How to Be a Bawse","Lilly Singh","Psychology & Self-Development"],["How to Talk to Anyone","Leil Lowndes","Psychology & Self-Development"],["The Success Principles","Jack Canfield","Psychology & Self-Development"],["The Power of Habit","Charles Duhigg","Psychology & Self-Development"],["The 7 Habits of Highly Effective People","Stephen R. Covey","Psychology & Self-Development"],["Think and Grow Rich","Napoleon Hill","Psychology & Self-Development"],["The One Thing","Gary Keller & Jay Papasan","Psychology & Self-Development"],["The Four Agreements","Don Miguel Ruiz","Psychology & Self-Development"],["The Subtle Art of Not Giving a F*ck","Mark Manson","Psychology & Self-Development"],["Everything Is F*cked","Mark Manson","Psychology & Self-Development"],["The Lean Startup","Eric Ries","Business & Entrepreneurship"],["Zero to One","Peter Thiel with Blake Masters","Business & Entrepreneurship"],["Shoe Dog","Phil Knight","Business & Entrepreneurship"],["Super Pumped","Mike Isaac","Business & Entrepreneurship"],["Lost and Founder","Rand Fishkin","Business & Entrepreneurship"],["The Four","Scott Galloway","Business & Entrepreneurship"],["Building a StoryBrand","Donald Miller","Business & Entrepreneurship"],["Business Made Simple","Donald Miller","Business & Entrepreneurship"],["#AskGaryVee","Gary Vaynerchuk","Business & Entrepreneurship"],["How I Built This","Guy Raz","Business & Entrepreneurship"],["Million Dollar Weekend","Noah Kagan with Tahl Raz","Business & Entrepreneurship"],["Hooked","Nir Eyal","Business & Entrepreneurship"],["Built to Last","Jim Collins & Jerry I. Porras","Business & Entrepreneurship"],["Made to Stick","Chip Heath & Dan Heath","Business & Entrepreneurship"],["Purple Cow","Seth Godin","Business & Entrepreneurship"],["The $100 Startup","Chris Guillebeau","Business & Entrepreneurship"],["The 1-Page Marketing Plan","Allan Dib","Business & Entrepreneurship"],["The Referral Engine","John Jantsch","Business & Entrepreneurship"],["The Art of the Start","Guy Kawasaki","Business & Entrepreneurship"],["The Intelligent Investor","Benjamin Graham","Money & Investing"],["Rich Dad Poor Dad","Robert T. Kiyosaki","Money & Investing"],["I Will Teach You to Be Rich","Ramit Sethi","Money & Investing"],["Get Good with Money","Tiffany Aliche","Money & Investing"],["A Random Walk Down Wall Street","Burton G. Malkiel","Money & Investing"],["Tax-Free Wealth","Tom Wheelwright","Money & Investing"],["Unshakeable","Tony Robbins","Money & Investing"],["The Millionaire Next Door","Thomas J. Stanley & William D. Danko","Money & Investing"],["Real Estate Investing 101","Michele Cagan","Money & Investing"],["Becoming","Michelle Obama","Memoirs & Biographies"],["Finding Me","Viola Davis","Memoirs & Biographies"],["Born a Crime","Trevor Noah","Memoirs & Biographies"],["A Promised Land","Barack Obama","Memoirs & Biographies"],["Long Walk to Freedom","Nelson Mandela","Memoirs & Biographies"],["I Am Malala","Malala Yousafzai","Memoirs & Biographies"],["Unfinished","Priyanka Chopra Jonas","Memoirs & Biographies"],["Greenlights","Matthew McConaughey","Memoirs & Biographies"],["Will","Will Smith","Memoirs & Biographies"],["The Autobiography of Gucci Mane","Gucci Mane","Memoirs & Biographies"],["Hurricanes","Rick Ross","Memoirs & Biographies"],["Elon Musk","Ashlee Vance","Memoirs & Biographies"],["Steve Jobs","Walter Isaacson","Memoirs & Biographies"],["King James","Jonathan Eig","Memoirs & Biographies"],["Meditations","Marcus Aurelius","Philosophy & Stoicism"],["The Stoic Challenge","William B. Irvine","Philosophy & Stoicism"],["The Prince","Niccolò Machiavelli","Philosophy & Stoicism"],["The Book of Joy","Dalai Lama, Desmond Tutu & Douglas Abrams","Philosophy & Stoicism"],["Peace Is Every Step","Thich Nhat Hanh","Spirituality & Faith"],["When Things Fall Apart","Pema Chödrön","Spirituality & Faith"],["Inner Engineering","Sadhguru","Spirituality & Faith"],["Conversations with God","Neale Donald Walsch","Spirituality & Faith"],["God Is Not Great","Christopher Hitchens","Spirituality & Faith"],["The Purpose Driven Life","Rick Warren","Spirituality & Faith"],["Marketing Artificial Intelligence","Paul Roetzer & Mike Kaput","Technology & AI"],["The AI Marketing Canvas","Rajkumar Venkatesan & Jim Lecinski","Technology & AI"],["Practical Statistics for Data Scientists","Peter Bruce, Andrew Bruce & Peter Gedeck","Science & Mathematics"],["Python for Probability, Statistics, and Machine Learning","José Unpingco","Science & Mathematics"],["R for Everyone","Jared P. Lander","Science & Mathematics"],["Machine Learning","Ethem Alpaydin","Technology & AI"],["The Design of Everyday Things","Don Norman","Design & Creativity"],["Change by Design","Tim Brown","Design & Creativity"],["Steal Like an Artist","Austin Kleon","Design & Creativity"],["The War of Art","Steven Pressfield","Design & Creativity"],["The Body Keeps the Score","Bessel van der Kolk","Health & Wellness"],["How Not to Die","Michael Greger, M.D.","Health & Wellness"],["How Not to Diet","Michael Greger, M.D.","Health & Wellness"],["The Housemaid","Freida McFadden","Thrillers & Mystery"],["Never Lie","Freida McFadden","Thrillers & Mystery"],["The Crash","Freida McFadden","Thrillers & Mystery"],["Do Not Disturb","Freida McFadden","Thrillers & Mystery"],["Gone Girl","Gillian Flynn","Thrillers & Mystery"],["The Woman in the Window","A. J. Finn","Thrillers & Mystery"],["The Guest List","Lucy Foley","Thrillers & Mystery"],["The Paris Apartment","Lucy Foley","Thrillers & Mystery"],["The Woman in Cabin 10","Ruth Ware","Thrillers & Mystery"],["The Couple Next Door","Shari Lapena","Thrillers & Mystery"],["The Last Mrs. Parrish","Liv Constantine","Thrillers & Mystery"],["Never Never","Colleen Hoover & Tarryn Fisher","Thrillers & Mystery"],["Americanah","Chimamanda Ngozi Adichie","Literary Fiction"],["The Seven Husbands of Evelyn Hugo","Taylor Jenkins Reid","Literary Fiction"],["The Song of Achilles","Madeline Miller","Literary Fiction"],["One Hundred Years of Solitude","Gabriel García Márquez","Literary Fiction"],["The Color Purple","Alice Walker","Literary Fiction"],["The Book Thief","Markus Zusak","Literary Fiction"],["All the Light We Cannot See","Anthony Doerr","Literary Fiction"],["Go Tell It on the Mountain","James Baldwin","Literary Fiction"],["Homegoing","Yaa Gyasi","Literary Fiction"],["The Kite Runner","Khaled Hosseini","Literary Fiction"],["A Thousand Splendid Suns","Khaled Hosseini","Literary Fiction"],["The Vanishing Half","Brit Bennett","Literary Fiction"],["The Mothers","Brit Bennett","Literary Fiction"],["Little Fires Everywhere","Celeste Ng","Literary Fiction"],["The Hate U Give","Angie Thomas","Literary Fiction"],["The Help","Kathryn Stockett","Literary Fiction"],["The Casual Vacancy","J. K. Rowling","Literary Fiction"],["The Great Gatsby","F. Scott Fitzgerald","Classics"],["The Grapes of Wrath","John Steinbeck","Classics"],["Native Son","Richard Wright","Classics"],["The Hobbit","J. R. R. Tolkien","Classics"],["Moby-Dick","Herman Melville","Classics"],["The Little Prince","Antoine de Saint-Exupéry","Classics"],["1984","George Orwell","Classics"],["I Am Not Your Negro","James Baldwin","History & Politics"],["Speeches That Changed the World","Various","History & Politics"],["Everybody Writes","Ann Handley","Writing & Communication"],["Words That Work","Frank Luntz","Writing & Communication"],["Attached","Amir Levine & Rachel Heller","Relationships"],["The Five Love Languages","Gary Chapman","Relationships"],["Men Are from Mars, Women Are from Venus","John Gray","Relationships"],["Things in Nature Merely Grow","Yiyun Li","Literary Fiction"],["Abundance","Ezra Klein & Derek Thompson","History & Politics"]];const K='my-books-final-v1';let B=JSON.parse(localStorage.getItem(K)||'null')||D.map((x,i)=>({id:'b'+i,title:x[0],author:x[1],genre:x[2],status:'Unread',rating:0,cover:'',isbn:'',summary:'',notes:'',published:'',pages:''}));let cur=null;const art=['https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=900','https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=900','https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=900','https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900'];function save(){localStorage.setItem(K,JSON.stringify(B))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0);if(id==='browse')browse();if(id==='search')renderSearch();if(id==='home')home()}function img(b){return b.cover||'https://covers.openlibrary.org/b/isbn/'+(b.isbn||'9780143127741')+'-M.jpg'}function card(b){return `<div class="book" onclick="openBook('${b.id}')"><img class="cover" src="${img(b)}" onerror="cover(this,'${b.id}')"><div class="bt">${b.title}</div><div class="ba">${b.author}</div></div>`}function home(){let reading=B.filter(b=>b.status==='Reading'),recent=B.slice(0,5),five=B.filter(b=>b.rating===5),done=B.filter(b=>b.status==='Finished');let sec=(t,a,n)=>a.length?`<div class="sec"><div class="head"><h2>${t}</h2></div><div class="row">${a.slice(0,n).map(card).join('')}</div></div>`:'';homebody.innerHTML=sec('Currently Reading',reading,3)+sec('Recently Added',recent,3)+sec('5 Star Books',five,3)+sec("Books I’ve Read",done,6)}function browse(){let g={};B.forEach(b=>(g[b.genre]??=[]).push(b));cats.innerHTML=Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([n,a],i)=>`<button class="cat" onclick="openCat('${encodeURIComponent(n)}')"><img src="${art[i%4]}"><span class="ct"><b>${n}</b><small>${a.length} books</small></span><span class="arr">›</span></button>`).join('')}function openCat(x){let n=decodeURIComponent(x),a=B.filter(b=>b.genre===n);catTitle.textContent=n;catGrid.innerHTML=a.map(card).join('');show('category')}function openBook(id){cur=B.find(b=>b.id===id);detailbody.innerHTML=`<div class="hero"><img class="cover" src="${img(cur)}" onerror="cover(this,'${cur.id}')"><h2>${cur.title}</h2><div class="muted">${cur.author}<br>${cur.genre}</div><div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="rate(${n})">${n<=cur.rating?'★':'☆'}</span>`).join('')}</div><div class="status">${['Unread','Reading','Finished'].map(s=>`<button class="pill ${cur.status===s?'on':''}" onclick="setStatus('${s}')">${s}</button>`).join('')}</div></div><div class="tabs"><button class="on">About</button><button onclick="notes()">Notes</button><button onclick="details()">Details</button></div><p class="copy">${cur.summary||'Metadata and a specific summary are fetched from free book sources when available.'}</p>`;show('detail');enrich(cur)}function rate(n){cur.rating=cur.rating===n?0:n;save();openBook(cur.id)}function setStatus(s){cur.status=s;save();openBook(cur.id)}function notes(){detailbody.innerHTML+=`<div class="field"><label>Private notes</label><textarea rows="7" onchange="cur.notes=this.value;save()">${cur.notes||''}</textarea></div>`}function details(){detailbody.innerHTML+=`<div class="details"><div class="drow"><span>Genre</span><b>${cur.genre}</b></div><div class="drow"><span>Status</span><b>${cur.status}</b></div><div class="drow"><span>ISBN</span><b>${cur.isbn||'—'}</b></div><div class="drow"><span>Published</span><b>${cur.published||'—'}</b></div><div class="drow"><span>Pages</span><b>${cur.pages||'—'}</b></div></div>`}function renderSearch(){let s=(q?.value||'').toLowerCase();results.innerHTML=s?B.filter(b=>(b.title+' '+b.author+' '+b.genre+' '+b.isbn).toLowerCase().includes(s)).map(b=>`<div class="result" onclick="openBook('${b.id}')"><img class="cover" src="${img(b)}" onerror="cover(this,'${b.id}')"><div><b>${b.title}</b><div class="muted">${b.author}</div><span class="owned">✓ IN YOUR LIBRARY</span></div></div>`).join(''):'<p class="muted">Search across your entire library.</p>'}async function cover(el,id){let b=B.find(x=>x.id===id);if(!b||b.loading)return;b.loading=1;try{let j=await fetch('https://openlibrary.org/search.json?limit=1&title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author)).then(r=>r.json()),d=j.docs?.[0];if(d?.cover_i){b.cover='https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg';b.isbn=b.isbn||(d.isbn||[]).find(x=>x.length===13)||(d.isbn||[])[0]||'';b.published=b.published||d.first_publish_year||'';b.pages=b.pages||d.number_of_pages_median||'';save();el.src=b.cover}}catch(e){}b.loading=0}async function enrich(b){if(b.cover&&b.isbn)return;let dummy=new Image;cover(dummy,b.id)}function addBook(){let t=nt.value.trim(),a=na.value.trim(),isbn=ni.value.trim();if(!t)return alert('Enter a title.');if(B.some(b=>(isbn&&b.isbn===isbn)||(b.title.toLowerCase()===t.toLowerCase()&&b.author.toLowerCase()===a.toLowerCase())))return alert('This book is already in your library.');B.unshift({id:'n'+Date.now(),title:t,author:a,genre:ng.value||'Other',isbn,status:'Unread',rating:0,cover:'',summary:'',notes:''});save();show('home')}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({books:B})],{type:'application/json'}));a.href=u;a.download='my-books-backup.json';a.click()}function restore(i){let r=new FileReader;r.onload=()=>{try{B=JSON.parse(r.result).books;save();show('home')}catch(e){alert('Could not restore backup')}};r.readAsText(i.files[0])}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Books</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial;color:#18221f}.app{max-width:430px;margin:auto;padding:18px 17px 90px}.page{display:none}.page.on{display:block}h1,h2,h3{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;background:none;font-weight:700;font-size:16px}.plus{border:0;border-radius:50%;width:40px;height:40px;background:#294f45;color:#fff;font-size:26px}.search{background:#efede8;border-radius:15px;padding:16px;margin:12px 0 23px}.search input{border:0;background:none;outline:0;width:90%;font-size:16px}.row,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid{gap:22px 14px}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;background:#eee;box-shadow:0 5px 14px #0002}.book{cursor:pointer}.title{font-size:11px;font-weight:700;margin-top:6px}.meta,.author{font-size:11px;color:#777}.sec{margin:27px 0}.cats{display:grid;gap:13px}.cat{height:120px;border:0;border-radius:17px;background:#294f45;color:white;text-align:left;padding:18px;font:21px Georgia}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:8px}.nav button{border:0;background:none;font-size:20px}.nav small{display:block;font-size:10px}.hero{text-align:center;background:#f4f0e8;margin:0 -17px;padding:22px}.hero .cover{width:160px}.hero h1{font-size:28px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#efede8;border-radius:19px;margin:18px 0}.tabs button{border:0;background:none;padding:14px}.tabs .on{background:white;border-radius:19px;font-weight:700}.statuschoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.statuschoices button{padding:12px 5px;border:1px solid #d8c98f;border-radius:14px;background:#f7efd2;font-size:15px;font-weight:600;color:#5b5130}.statuschoices button.on{background:#294f45;color:#fff;border-color:#294f45}.stars button{border:0;background:none;color:#d49b00;font-size:28px}.identity{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.identity .cover{width:120px}.note{border:1px solid #e5ddd2;border-radius:18px;padding:20px;min-height:180px}.drow{display:grid;grid-template-columns:120px 1fr;padding:17px 10px;border-bottom:1px solid #e6dfd5}.field{margin:15px 0}.field input,.field textarea,.field select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px}.result{display:grid;grid-template-columns:75px 1fr;gap:13px;padding:12px 0;border-bottom:1px solid #eee}.result .cover{width:75px}</style></head><body><main class="app"><section id="home" class="page"></section><section id="browse" class="page"></section><section id="category" class="page"></section><section id="search" class="page"></section><section id="add" class="page"></section><section id="about" class="page"></section><section id="notes" class="page"></section><section id="details" class="page"></section><section id="more" class="page"></section></main><nav class="nav"><button onclick="go('home')">⌂<small>Home</small></button><button onclick="go('browse')">▤<small>Browse</small></button><button onclick="go('search')">⌕<small>Search</small></button><button onclick="go('add')">⊕<small>Add</small></button><button onclick="go('more')">☰<small>More</small></button></nav><script src="books-data.js?v=18"></script><script>let books=[],current=null,previous='browse';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');function save(){localStorage.setItem('my-books-v18',JSON.stringify(books))}function cover(b){let i=String(b.isbn||'').replace(/[^0-9X]/gi,'');return b.cover||(/^\d{10}(\d{3})?$/.test(i)?'https://covers.openlibrary.org/b/isbn/'+i+'-L.jpg':'')}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}function go(id){if(id==='home')renderHome();if(id==='browse')renderBrowse();if(id==='search')renderSearch();if(id==='add')renderAdd();if(id==='more')renderMore();show(id)}function card(b){return `<div class="book" onclick="openBook('${b.id}')"><img class="cover" src="${esc(cover(b))}"><div class="title">${esc(b.title)}</div><div class="author">${esc(b.author)}</div></div>`}function renderHome(){let sec=(t,a,n)=>`<div class="sec"><h2>${t}</h2>${a.length?`<div class="row">${a.slice(0,n).map(card).join('')}</div>`:'<p class="meta">No books here yet.</p>'}</div>`;$('home').innerHTML=`<div class="top"><h1>My Books</h1><button class="plus" onclick="go('add')">+</button></div><div class="search" onclick="go('search')">⌕ Search by title, author, genre or ISBN</div>${sec('Currently Reading',books.filter(b=>b.status==='Reading'),3)}${sec('Recently Added',books.filter(b=>b.dateAdded),3)}${sec('5 Star Books',books.filter(b=>b.rating===5),3)}${sec("Books I’ve Read",books.filter(b=>b.status==='Finished'),6)}`}function renderBrowse(){let g={};books.forEach(b=>(g[b.genre||'Other']??=[]).push(b));$('browse').innerHTML=`<div class="top"><h1>Browse</h1><button class="btn" onclick="go('search')">⌕</button></div><div class="cats">${Object.entries(g).map(([n,a])=>`<button class="cat" onclick="openCat('${encodeURIComponent(n)}')">${esc(n)}<br><small>${a.length} books</small></button>`).join('')}</div>`}function openCat(x){let n=decodeURIComponent(x),a=books.filter(b=>b.genre===n);$('category').innerHTML=`<div class="top"><button class="btn" onclick="go('browse')">‹</button><h2>${esc(n)}</h2><span></span></div><div class="grid">${a.map(card).join('')}</div>`;previous='category';show('category')}function renderSearch(){$('search').innerHTML=`<div class="top"><h1>Search</h1><button class="btn" onclick="go('home')">✕</button></div><div class="search">⌕ <input id="q" placeholder="Search My Books" oninput="searchNow()"></div><div id="results"></div>`}function searchNow(){let s=$('q').value.toLowerCase(),a=books.filter(b=>[b.title,b.author,b.genre,b.isbn].join(' ').toLowerCase().includes(s));$('results').innerHTML=s?a.map(b=>`<div class="result" onclick="openBook('${b.id}')"><img class="cover" src="${esc(cover(b))}"><div><b>${esc(b.title)}</b><div class="meta">${esc(b.author)}</div></div></div>`).join(''):'';previous='search'}function openBook(id){current=books.find(b=>b.id===id);renderAbout();show('about')}function tabs(active){return `<div class="tabs"><button class="${active==='about'?'on':''}" onclick="openAbout()">About</button><button class="${active==='notes'?'on':''}" onclick="openNotes()">Notes</button><button class="${active==='details'?'on':''}" onclick="openDetails()">Details</button></div>`}function ident(){return `<div class="identity"><img class="cover" src="${esc(cover(current))}"><div><h2>${esc(current.title)}</h2><div class="meta">${esc(current.author)}</div></div></div>`}function renderAbout(){let b=current;$('about').innerHTML=`<div class="top"><button class="btn" onclick="go('${previous==='search'?'search':previous==='category'?'browse':'browse'}')">‹</button><span></span><span></span></div><div class="hero"><img class="cover" src="${esc(cover(b))}"><h1>${esc(b.title)}</h1><div class="meta">${esc(b.author)} · ${esc(b.genre)}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">${n<=b.rating?'★':'☆'}</button>`).join('')}</div><div class="statuschoices"><button class="${b.status==='Unread'?'on':''}" onclick="setStatus('Unread')">Unread</button><button class="${b.status==='Reading'?'on':''}" onclick="setStatus('Reading')">Reading</button><button class="${b.status==='Finished'?'on':''}" onclick="setStatus('Finished')">Finished</button></div></div>${tabs('about')}<p style="line-height:1.6">${esc(b.summary||'No summary available.')}</p>`}function openAbout(){renderAbout();show('about')}function openNotes(){$('notes').innerHTML=`<div class="top"><button class="btn" onclick="openAbout()">‹</button><h2>Notes</h2><button class="btn" onclick="editNote()">＋</button></div>${ident()}${tabs('notes')}<div class="note"><h3>My Notes</h3><p>${current.notes?esc(current.notes):'No notes yet. Tap + to add notes.'}</p></div>`;show('notes')}function openDetails(){let b=current,rows=[['Genre',b.genre],['Status',b.status],['My Rating',b.rating?'★'.repeat(b.rating):'—'],['ISBN',b.isbn||'—'],['Published',b.published||b.year||'—'],['Pages',b.pages||'—'],['Date Added',b.dateAdded||'—'],['Date Read',b.dateRead||'—']];$('details').innerHTML=`<div class="top"><button class="btn" onclick="openAbout()">‹</button><h2>Details</h2><span></span></div>${ident()}${tabs('details')}${rows.map(r=>`<div class="drow"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}`;show('details')}function rate(n){current.rating=n;save();renderAbout()}function setStatus(v){current.status=v;if(v==='Finished'&&!current.dateRead)current.dateRead=new Date().toISOString().slice(0,10);save();renderAbout()}function editNote(){let v=prompt('My Notes',current.notes||'');if(v!==null){current.notes=v;save();openNotes()}}function renderAdd(){$('add').innerHTML=`<div class="top"><button class="btn" onclick="go('home')">Cancel</button><h2>Add Book</h2><button class="btn" onclick="addBook()">Save</button></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Author</label><input id="na"></div><div class="field"><label>Genre</label><input id="ng"></div><div class="field"><label>Status</label><select id="ns"><option>Unread</option><option>Reading</option><option>Finished</option></select></div><div class="field"><label>Summary</label><textarea id="nsm"></textarea></div><div class="field"><label>ISBN</label><input id="ni"></div>`}function addBook(){let t=$('nt').value.trim(),a=$('na').value.trim();if(!t||!a)return alert('Title and author required');books.unshift({id:norm(t)+'-'+norm(a),title:t,author:a,genre:$('ng').value||'Other',status:$('ns').value,summary:$('nsm').value,isbn:$('ni').value,rating:0,notes:'',dateAdded:new Date().toISOString().slice(0,10)});save();go('home')}function renderMore(){$('more').innerHTML='<h1>More</h1><h2>Library Management</h2><p>Backup / Restore</p><h2>App Settings</h2><p>Appearance</p><p>Sort Books</p><p>Display</p><p>Privacy</p>'}async function init(){let a=Uint8Array.from(atob(window.BOOK_DATA_GZ),c=>c.charCodeAt(0)),seed=JSON.parse(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),old=[];try{old=JSON.parse(localStorage.getItem('my-books-v18')||localStorage.getItem('my-books-v17')||'[]')}catch(e){}books=seed.map(b=>{b.id=norm(b.title)+'-'+norm(b.author);let p=old.find(x=>x.id===b.id);return {...b,...(p||{}),status:p?.status||'Unread',rating:+(p?.rating||0),notes:p?.notes||''}});save();renderHome();renderBrowse();show('home')}init();if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));</script></body></html>

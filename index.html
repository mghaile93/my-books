<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Books</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial;color:#18221f;font-size:16px}.app{max-width:430px;margin:auto;padding:18px 17px 88px}.page{display:none}.page.on{display:block}h1,h2,h3{font-family:Georgia,serif}.page>.top h1,#home h1,#browse h1,#search h1{font-size:30px}.sec h2{font-size:22px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;background:none;font-weight:700;font-size:16px}.plus{border:0;border-radius:50%;width:40px;height:40px;background:#294f45;color:#fff;font-size:28px}.search{background:#efede8;border-radius:15px;padding:16px;margin:12px 0 23px;font-size:16px}.search input{border:0;background:none;outline:0;width:90%;font-size:16px}.row,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid{gap:22px 14px}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;background:#eee;box-shadow:0 5px 14px #0002}.book{cursor:pointer}.title{font-size:11px;font-weight:700;margin-top:6px}.meta,.author{font-size:11px;color:#777}.sec{margin:27px 0}.sec>.meta{font-size:11px}.cats{display:grid;gap:13px}.cat{height:124px;border:0;border-radius:17px;position:relative;overflow:hidden;text-align:left;color:#fff;background-size:cover!important;background-position:center!important}.cat:after{content:'';position:absolute;inset:0;background:rgba(12,39,32,.52)}.cat span{position:absolute;z-index:2;left:18px;bottom:17px}.cat b{font:22px Georgia;display:block}.cat small{font-size:14px}.cat i{position:absolute;z-index:2;right:18px;top:45px;font-size:28px}.nav{position:fixed;z-index:9999;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:62px;display:grid;grid-template-columns:repeat(4,1fr);align-items:start;background:#294f45;border-top:1px solid #294f45;padding:0 8px 12px;isolation:isolate;overflow:hidden}.nav button{border:0;background:#294f45;font-size:28px;line-height:.85;color:#fff;-webkit-text-fill-color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:50px;padding:0;gap:0;position:relative;z-index:10000}.nav small{display:block;font-size:14px;line-height:1;color:#fff;-webkit-text-fill-color:#fff}.hero{text-align:center;background:#f4f0e8;margin:0 -17px;padding:22px}.hero .cover{width:160px}.hero h1{font-size:20px}.hero .meta{font-size:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#efede8;border-radius:19px;margin:18px 0}.tabs button{border:0;background:none;padding:14px;font-size:16px}.tabs .on{background:white;border-radius:19px;font-weight:700}.statuschoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.statuschoices button{padding:12px 5px;border:1px solid #d8c98f;border-radius:14px;background:#f7efd2;font-size:16px;font-weight:600;color:#5b5130}.statuschoices button.on{background:#294f45;color:#fff;border-color:#294f45}.stars button{border:0;background:none;color:#d49b00;font-size:28px}.identity{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.identity .cover{width:120px}.identity h2{font-size:20px}.identity .meta{font-size:16px}.note{border:1px solid #e5ddd2;border-radius:18px;padding:20px;min-height:180px;font-size:16px}.drow{display:grid;grid-template-columns:120px 1fr;padding:17px 10px;border-bottom:1px solid #e6dfd5;font-size:16px}.result{display:grid;grid-template-columns:75px 1fr;gap:13px;padding:12px 0;border-bottom:1px solid #eee}.result .cover{width:75px}.result b{font-size:16px}.result .meta{font-size:11px}#category .top h2{font-size:22px}#about>p{font-size:16px}.search-icon,.close-icon,.back-icon,.action-icon{font-size:28px!important;position:relative;top:-2px}#add{margin:0 -3px}#add .addhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:5px 6px 18px}#add .addhead h2{font-size:24px;margin:0;font-family:Georgia,serif}#add .addhead .save{text-align:right}#add .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}#add .mode{height:116px;border:0;border-radius:18px;background:#efede8;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}#add .modeicon{font-size:28px;font-weight:700;line-height:1}#add .addpanel{background:#fffdfa;border-radius:18px;padding:25px 14px 20px;box-shadow:0 0 22px rgba(92,71,43,.04)}#add .lookup-label,#add .field label{display:block;color:#77706a;font-size:16px;margin-bottom:8px}#add .lookup{margin-bottom:18px;position:relative}#add .lookup input{width:100%;height:58px;border:1px solid #e4d8ca;border-radius:13px;padding:0 16px;font-size:20px}#add .field{margin:0 0 16px}#add .field input,#add .field select{width:100%;height:58px;padding:0 14px;border:1px solid #e4d8ca;border-radius:13px;background:#fff;font-size:16px}#add .field textarea{width:100%;height:145px;padding:14px;border:1px solid #e4d8ca;border-radius:13px;background:#fff;font-size:16px;resize:vertical}.addresults{background:#fff;border:1px solid #e4d8ca;border-radius:13px;margin-top:7px;overflow:hidden}.addresult{display:grid;grid-template-columns:48px 1fr;gap:10px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;padding:9px;align-items:center}.addresult:last-child{border-bottom:0}.addresult img{width:48px;height:70px;object-fit:cover;background:#eee;border-radius:4px}.addresult b{font-size:14px;display:block}.addresult small{font-size:12px;color:#777}.scanmodal{position:fixed;inset:0;background:#000;z-index:20000;display:flex;flex-direction:column;color:#fff}.scanbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-size:18px}.scanbar button{border:0;background:none;color:#fff;font-size:18px}.scanner{position:relative;flex:1;overflow:hidden}.scanner video,.scanner canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover}.scanbox{position:absolute;z-index:5;left:8%;right:8%;top:38%;height:145px;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px #0005}.scanhint{position:absolute;z-index:6;left:20px;right:20px;bottom:55px;text-align:center;font-size:16px}.scanstatus{position:absolute;z-index:6;left:20px;right:20px;top:20px;text-align:center;background:#0009;border-radius:12px;padding:10px}.drawingBuffer{display:none!important}</style></head><body><main class="app"><section id="home" class="page"></section><section id="browse" class="page"></section><section id="category" class="page"></section><section id="search" class="page"></section><section id="add" class="page"></section><section id="about" class="page"></section><section id="notes" class="page"></section><section id="details" class="page"></section></main><nav class="nav"><button onclick="go('home')">⌂<small>Home</small></button><button onclick="go('browse')">▤<small>Browse</small></button><button onclick="go('search')">⌕<small>Search</small></button><button onclick="go('add')">⊕<small>Add</small></button></nav><script src="books-data.js?v=18"></script><script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script><script>let books=[],current=null,previous='browse',scannerOn=false,addTimer=null,addSearchDocs=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');function save(){localStorage.setItem('my-books-v18',JSON.stringify(books))}function cover(b){let i=String(b.isbn||'').replace(/[^0-9X]/gi,'');return b.cover||(/^\d{10}(\d{3})?$/.test(i)?'https://covers.openlibrary.org/b/isbn/'+i+'-L.jpg':'')}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}function go(id){if(scannerOn)stopISBNScan();if(id==='home')renderHome();if(id==='browse')renderBrowse();if(id==='search')renderSearch();if(id==='add')renderAdd();show(id)}function card(b){return `<div class="book" onclick="openBook('${b.id}')"><img class="cover" src="${esc(cover(b))}"><div class="title">${esc(b.title)}</div><div class="author">${esc(b.author)}</div></div>`}function renderHome(){let sec=(t,a,n)=>`<div class="sec"><h2>${t}</h2>${a.length?`<div class="row">${a.slice(0,n).map(card).join('')}</div>`:'<p class="meta">No books here yet.</p>'}</div>`;$('home').innerHTML=`<div class="top"><h1>My Books</h1><button class="plus" onclick="go('add')">+</button></div><div class="search" onclick="go('search')"><span class="search-icon">⌕</span> Search by title, author, genre or ISBN</div>${sec('Currently Reading',books.filter(b=>b.status==='Reading'),3)}${sec('Recently Added',books.filter(b=>b.dateAdded),3)}${sec('5 Star Books',books.filter(b=>b.rating===5),3)}${sec("Books I’ve Read",books.filter(b=>b.status==='Finished'),6)}`}function renderBrowse(){let g={};books.forEach(b=>(g[b.genre||'Other']??=[]).push(b));let pics=['https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=900&q=85'];$('browse').innerHTML=`<div class="top"><h1>Browse</h1><button class="btn search-icon" onclick="go('search')">⌕</button></div><div class="cats">${Object.entries(g).map(([n,a],i)=>`<button class="cat" style="background-image:url('${pics[i%pics.length]}')" onclick="openCat('${encodeURIComponent(n)}')"><span><b>${esc(n)}</b><small>${a.length} books</small></span><i>›</i></button>`).join('')}</div>`}function openCat(x){let n=decodeURIComponent(x),a=books.filter(b=>b.genre===n);$('category').innerHTML=`<div class="top"><button class="btn back-icon" onclick="go('browse')">‹</button><h2>${esc(n)}</h2><span></span></div><div class="grid">${a.map(card).join('')}</div>`;previous='category';show('category')}function renderSearch(){$('search').innerHTML=`<div class="top"><h1>Search</h1><button class="btn close-icon" onclick="go('home')">✕</button></div><div class="search"><span class="search-icon">⌕</span> <input id="q" placeholder="Search My Books" oninput="searchNow()"></div><div id="results"></div>`}function searchNow(){let s=$('q').value.toLowerCase(),a=books.filter(b=>[b.title,b.author,b.genre,b.isbn].join(' ').toLowerCase().includes(s));$('results').innerHTML=s?a.map(b=>`<div class="result" onclick="openBook('${b.id}')"><img class="cover" src="${esc(cover(b))}"><div><b>${esc(b.title)}</b><div class="meta">${esc(b.author)}</div></div></div>`).join(''):'';previous='search'}function openBook(id){current=books.find(b=>b.id===id);renderAbout();show('about')}function tabs(active){return `<div class="tabs"><button class="${active==='about'?'on':''}" onclick="openAbout()">About</button><button class="${active==='notes'?'on':''}" onclick="openNotes()">Notes</button><button class="${active==='details'?'on':''}" onclick="openDetails()">Details</button></div>`}function ident(){return `<div class="identity"><img class="cover" src="${esc(cover(current))}"><div><h2>${esc(current.title)}</h2><div class="meta">${esc(current.author)}</div></div></div>`}function renderAbout(){let b=current;$('about').innerHTML=`<div class="top"><button class="btn back-icon" onclick="go('${previous==='search'?'search':previous==='category'?'browse':'browse'}')">‹</button><span></span><span></span></div><div class="hero"><img class="cover" src="${esc(cover(b))}"><h1>${esc(b.title)}</h1><div class="meta">${esc(b.author)} · ${esc(b.genre)}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">${n<=b.rating?'★':'☆'}</button>`).join('')}</div><div class="statuschoices"><button class="${b.status==='Unread'?'on':''}" onclick="setStatus('Unread')">Unread</button><button class="${b.status==='Reading'?'on':''}" onclick="setStatus('Reading')">Reading</button><button class="${b.status==='Finished'?'on':''}" onclick="setStatus('Finished')">Finished</button></div></div>${tabs('about')}<p style="line-height:1.6">${esc(b.summary||'No summary available.')}</p>`}function openAbout(){renderAbout();show('about')}function openNotes(){$('notes').innerHTML=`<div class="top"><button class="btn back-icon" onclick="openAbout()">‹</button><span></span><button class="btn action-icon" onclick="editNote()">＋</button></div>${ident()}${tabs('notes')}<div class="note"><p>${current.notes?esc(current.notes):'No notes yet. Tap + to add notes.'}</p></div>`;show('notes')}function openDetails(){let b=current,rows=[['Genre',b.genre],['Status',b.status],['My Rating',b.rating?'★'.repeat(b.rating):'—'],['ISBN',b.isbn||'—'],['Published',b.published||b.year||'—'],['Pages',b.pages||'—'],['Date Added',b.dateAdded||'—'],['Date Read',b.dateRead||'—']];$('details').innerHTML=`<div class="top"><button class="btn back-icon" onclick="openAbout()">‹</button><span></span><span></span></div>${ident()}${tabs('details')}${rows.map(r=>`<div class="drow"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}`;show('details')}function rate(n){current.rating=n;save();renderAbout()}function setStatus(v){current.status=v;if(v==='Finished'&&!current.dateRead)current.dateRead=new Date().toISOString().slice(0,10);save();renderAbout()}function editNote(){let v=prompt('My Notes',current.notes||'');if(v!==null){current.notes=v;save();openNotes()}}function renderAdd(){$('add').innerHTML=`<div class="addhead"><button class="btn" onclick="go('home')">Cancel</button><h2>Add Book</h2><button class="btn save" onclick="addBook()">Save</button></div><div class="modes"><button class="mode" onclick="startISBNScan()"><span class="modeicon">▣</span><span>Scan ISBN</span></button><button class="mode" onclick="document.getElementById('nt').focus()"><span class="modeicon">+</span><span>Manual</span></button></div><div class="addpanel"><div class="lookup"><label class="lookup-label">Search by title, author, or ISBN</label><input id="lookup" placeholder="Start typing..." oninput="addLookup(this.value)"><div id="addresults"></div></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Author</label><input id="na"></div><div class="field"><label>Genre</label><input id="ng"></div><div class="field"><label>Status</label><select id="ns"><option>Unread</option><option>Reading</option><option>Finished</option></select></div><div class="field"><label>Summary</label><textarea id="nsm"></textarea></div><div class="field"><label>ISBN</label><input id="ni"></div></div>`}function addLookup(v){clearTimeout(addTimer);let q=v.trim();if(q.length<2){if($('addresults'))$('addresults').innerHTML='';return}addTimer=setTimeout(async()=>{let box=$('addresults');if(!box)return;box.innerHTML='<div style="padding:10px;color:#777">Searching…</div>';try{let r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&fields=key,title,author_name,first_publish_year,cover_i,isbn,subject,number_of_pages_median&limit=8');let d=await r.json();addSearchDocs=d.docs||[];box.className='addresults';box.innerHTML=addSearchDocs.length?addSearchDocs.map((b,i)=>`<button class="addresult" onclick="selectAddResult(${i})"><img src="${b.cover_i?'https://covers.openlibrary.org/b/id/'+b.cover_i+'-M.jpg':''}"><span><b>${esc(b.title)}</b><small>${esc((b.author_name||[]).join(', '))}${b.first_publish_year?' · '+b.first_publish_year:''}</small></span></button>`).join(''):'<div style="padding:10px;color:#777">No books found</div>'}catch(e){box.innerHTML='<div style="padding:10px;color:#777">Search unavailable. Try again.</div>'}},350)}async function selectAddResult(i){let b=addSearchDocs[i];if(!b)return;$('nt').value=b.title||'';$('na').value=(b.author_name||[]).join(', ');$('ng').value=(b.subject||[])[0]||'';$('ni').value=(b.isbn||[]).find(x=>String(x).length===13)||(b.isbn||[])[0]||'';$('nsm').value='';let box=$('addresults');if(box)box.innerHTML='';$('lookup').value=b.title||'';if(b.key){try{let w=await fetch('https://openlibrary.org'+(b.key.startsWith('/')?b.key:'/'+b.key)+'.json').then(r=>r.json());$('nsm').value=typeof w.description==='string'?w.description:(w.description?.value||'');if(!$('ng').value)$('ng').value=(w.subjects||[])[0]||''}catch(e){}}}async function startISBNScan(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert('Camera access is not available in this browser.');if(!window.Quagga)return alert('The barcode scanner could not load. Please check your internet connection.');let m=document.createElement('div');m.id='scanmodal';m.className='scanmodal';m.innerHTML=`<div class="scanbar"><b>Scan ISBN</b><button onclick="stopISBNScan()">Done</button></div><div id="scanner" class="scanner"><div class="scanstatus" id="scanstatus">Point the camera at the ISBN barcode</div><div class="scanbox"></div><div class="scanhint">Hold the barcode inside the box</div></div>`;document.body.appendChild(m);scannerOn=true;Quagga.init({inputStream:{name:'Live',type:'LiveStream',target:document.querySelector('#scanner'),constraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},area:{top:'20%',right:'5%',left:'5%',bottom:'20%'}},locator:{patchSize:'medium',halfSample:true},numOfWorkers:navigator.hardwareConcurrency||2,frequency:10,decoder:{readers:['ean_reader','upc_reader','upc_e_reader']}},err=>{if(err){stopISBNScan();alert('Could not open the camera. Please allow camera access and try again.');return}Quagga.start()});Quagga.offDetected(onISBNDetected);Quagga.onDetected(onISBNDetected)}async function onISBNDetected(r){let code=String(r?.codeResult?.code||'').replace(/\D/g,'');if(!/^97[89]\d{10}$/.test(code))return;let s=$('scanstatus');if(s)s.textContent='ISBN '+code+' found. Loading book…';Quagga.offDetected(onISBNDetected);try{await lookupISBN(code);stopISBNScan()}catch(e){if(s)s.textContent='Book data not found. Try scanning again.';Quagga.onDetected(onISBNDetected)}}function stopISBNScan(){if(scannerOn&&window.Quagga){try{Quagga.offDetected(onISBNDetected);Quagga.stop()}catch(e){}}scannerOn=false;let m=$('scanmodal');if(m)m.remove()}async function lookupISBN(isbn){let res=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json');if(!res.ok)throw Error('not found');let ed=await res.json(),author='',summary='',genre='';if(ed.authors?.[0]?.key){try{let ar=await fetch('https://openlibrary.org'+ed.authors[0].key+'.json').then(r=>r.json());author=ar.name||''}catch(e){}}if(ed.works?.[0]?.key){try{let w=await fetch('https://openlibrary.org'+ed.works[0].key+'.json').then(r=>r.json());summary=typeof w.description==='string'?w.description:(w.description?.value||'');genre=(w.subjects||[])[0]||''}catch(e){}}$('ni').value=isbn;$('nt').value=ed.title||'';$('na').value=author;$('ng').value=genre;$('nsm').value=summary;$('lookup').value=isbn;if(!$('nt').value)throw Error('no metadata')}function addBook(){let t=$('nt').value.trim(),a=$('na').value.trim();if(!t||!a)return alert('Title and author required');let isbn=$('ni').value.trim();books.unshift({id:norm(t)+'-'+norm(a),title:t,author:a,genre:$('ng').value||'Other',status:$('ns').value,summary:$('nsm').value,isbn:isbn,cover:isbn?'https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg':'',rating:0,notes:'',dateAdded:new Date().toISOString().slice(0,10)});save();go('home')}async function init(){let a=Uint8Array.from(atob(window.BOOK_DATA_GZ),c=>c.charCodeAt(0)),seed=JSON.parse(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),old=[];try{old=JSON.parse(localStorage.getItem('my-books-v18')||localStorage.getItem('my-books-v17')||'[]')}catch(e){}books=seed.map(b=>{b.id=norm(b.title)+'-'+norm(b.author);let p=old.find(x=>x.id===b.id);return {...b,...(p||{}),status:p?.status||'Unread',rating:+(p?.rating||0),notes:p?.notes||''}});save();renderHome();renderBrowse();show('home')}init();if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));</script></body></html>

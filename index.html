<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>My Books</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}.app{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom))}h1{font-size:34px;margin:8px 0 18px}.search{width:100%;border:0;background:#f2f2f7;border-radius:13px;padding:12px 14px;font-size:16px}.section{margin:30px 0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:22px;margin:0}.link{border:0;background:none;color:#d65a00;font-size:15px}.row{display:flex;gap:14px;overflow:auto;padding-bottom:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}.book{min-width:118px;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#eee;box-shadow:0 5px 15px #0002}.title{font-size:14px;font-weight:650;margin-top:7px}.author{font-size:12px;color:#777;margin-top:2px}.empty{color:#777;font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid #ddd;padding:9px max(14px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:none;font-size:13px;color:#555}.nav button.active{color:#d65a00}.screen{display:none}.screen.active{display:block}.back{border:0;background:none;color:#d65a00;font-size:17px;padding:0;margin-bottom:14px}.detailCover{width:52%;max-width:260px;display:block;margin:10px auto 20px;border-radius:10px;box-shadow:0 8px 25px #0003}.detail h2{font-size:28px;margin:5px 0}.stars{font-size:29px;letter-spacing:3px;color:#f5a000;cursor:pointer;margin:15px 0}.pill{border:1px solid #ddd;background:#fff;border-radius:20px;padding:8px 12px;margin:3px}.pill.on{background:#111;color:#fff}.tabs{display:flex;gap:20px;border-bottom:1px solid #ddd;margin-top:20px}.tabs button{border:0;background:none;padding:12px 0;font-weight:600}.tabs button.on{border-bottom:2px solid #111}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:16px}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;margin-top:8px}.danger{background:#fff;color:#c00;border:1px solid #ddd}.cat{padding:18px;background:#f5f5f7;border-radius:16px;font-size:17px;font-weight:650}.muted{color:#777}.badge{font-size:11px;font-weight:800;color:#16803a;text-transform:uppercase}.notes{min-height:130px}</style></head><body><main class="app"><section id="home" class="screen active"><h1>My Books</h1><input class="search" placeholder="Search your library" oninput="showSearch(this.value)"><div id="homeSections"></div></section><section id="browse" class="screen"><h1>Browse</h1><div id="categories" style="display:grid;gap:12px"></div></section><section id="search" class="screen"><h1>Search</h1><input id="searchInput" class="search" placeholder="Title, author, genre or ISBN" oninput="renderSearch(this.value)"><div id="searchResults" class="section grid"></div></section><section id="add" class="screen"><h1>Add Book</h1><input id="aTitle" class="field" placeholder="Title"><input id="aAuthor" class="field" placeholder="Author"><input id="aGenre" class="field" placeholder="Genre / category"><input id="aIsbn" class="field" placeholder="ISBN"><button class="primary" onclick="addBook()">Add to My Books</button><p class="muted">You can add by title/author or ISBN. Metadata and real covers are fetched automatically when available.</p></section><section id="settings" class="screen"><h1>More</h1><button class="primary" onclick="backup()">Backup Library</button><label class="primary" style="display:block;text-align:center;margin-top:12px">Restore Library<input type="file" accept="application/json" hidden onchange="restore(this)"></label><p class="muted">Your library stays on this device. No account or subscription.</p></section><section id="list" class="screen"><button class="back" onclick="goBack()">‹ Back</button><h1 id="listTitle"></h1><div id="listGrid" class="grid"></div></section><section id="detail" class="screen detail"><button class="back" onclick="goBack()">‹ Back</button><div id="detailBody"></div></section></main><nav class="nav"><button onclick="nav('home')">⌂<br>Home</button><button onclick="nav('browse')">▦<br>Browse</button><button onclick="nav('search')">⌕<br>Search</button><button onclick="nav('add')">＋<br>Add</button><button onclick="nav('settings')">•••<br>More</button></nav><script>const cats=['Psychology & Self-Development','Business & Entrepreneurship','Money & Investing','Memoirs & Biographies','Relationships','Philosophy & Stoicism','Spirituality & Faith','History & Politics','Technology & AI','Science & Mathematics','Design & Creativity','Health & Wellness','Thrillers & Mystery','Literary Fiction','Romance','Classics','Writing & Communication'];const seed=[['Atomic Habits','James Clear','Psychology & Self-Development','Finished',5],['Americanah','Chimamanda Ngozi Adichie','Literary Fiction','Finished',5],['Becoming','Michelle Obama','Memoirs & Biographies','Finished',5],['Finding Me','Viola Davis','Memoirs & Biographies','Finished',0],['Born a Crime','Trevor Noah','Memoirs & Biographies','Finished',5],['The Housemaid','Freida McFadden','Thrillers & Mystery','Finished',0],['Never Lie','Freida McFadden','Thrillers & Mystery','Finished',0],['The Crash','Freida McFadden','Thrillers & Mystery','Reading',0],['Do Not Disturb','Freida McFadden','Thrillers & Mystery','Unread',0],['Gone Girl','Gillian Flynn','Thrillers & Mystery','Finished',5],['The Guest List','Lucy Foley','Thrillers & Mystery','Finished',0],['The Paris Apartment','Lucy Foley','Thrillers & Mystery','Finished',0],['The Seven Husbands of Evelyn Hugo','Taylor Jenkins Reid','Literary Fiction','Finished',5],['The Song of Achilles','Madeline Miller','Literary Fiction','Finished',5],['One Hundred Years of Solitude','Gabriel García Márquez','Classics','Finished',0],['The Great Gatsby','F. Scott Fitzgerald','Classics','Finished',0],['The Grapes of Wrath','John Steinbeck','Classics','Finished',0],['Native Son','Richard Wright','Classics','Finished',0],['The Hobbit','J.R.R. Tolkien','Classics','Finished',5],['Moby-Dick','Herman Melville','Classics','Unread',0],['Go Tell It on the Mountain','James Baldwin','Classics','Finished',0],['I Am Not Your Negro','James Baldwin','History & Politics','Finished',0],['The Color Purple','Alice Walker','Classics','Finished',5],['The Book Thief','Markus Zusak','Literary Fiction','Finished',0],['All the Light We Cannot See','Anthony Doerr','Literary Fiction','Finished',0],['The Lean Startup','Eric Ries','Business & Entrepreneurship','Finished',0],['Zero to One','Peter Thiel','Business & Entrepreneurship','Finished',0],['Shoe Dog','Phil Knight','Business & Entrepreneurship','Finished',5],['Super Pumped','Mike Isaac','Business & Entrepreneurship','Finished',0],['Lost and Founder','Rand Fishkin','Business & Entrepreneurship','Unread',0],['The Four','Scott Galloway','Business & Entrepreneurship','Finished',0],['Building a StoryBrand','Donald Miller','Writing & Communication','Finished',0],['Business Made Simple','Donald Miller','Business & Entrepreneurship','Reading',0],['#AskGaryVee','Gary Vaynerchuk','Business & Entrepreneurship','Unread',0],['How I Built This','Guy Raz','Business & Entrepreneurship','Finished',0],['Million Dollar Weekend','Noah Kagan','Business & Entrepreneurship','Unread',0],['Hooked','Nir Eyal','Business & Entrepreneurship','Finished',0],['Marketing Artificial Intelligence','Paul Roetzer & Mike Kaput','Technology & AI','Reading',0],['The AI Marketing Canvas','Rajkumar Venkatesan & Jim Lecinski','Technology & AI','Unread',0],['The Design of Everyday Things','Don Norman','Design & Creativity','Finished',5],['Practical Statistics for Data Scientists','Peter Bruce, Andrew Bruce & Peter Gedeck','Science & Mathematics','Reading',0],['Python for Probability, Statistics, and Machine Learning','José Unpingco','Science & Mathematics','Unread',0],['R for Everyone','Jared P. Lander','Science & Mathematics','Unread',0],['Machine Learning','Ethem Alpaydin','Technology & AI','Unread',0],['The Intelligent Investor','Benjamin Graham','Money & Investing','Finished',0],['Rich Dad Poor Dad','Robert Kiyosaki','Money & Investing','Finished',0],['I Will Teach You to Be Rich','Ramit Sethi','Money & Investing','Finished',0],['Get Good with Money','Tiffany Aliche','Money & Investing','Finished',0],['A Random Walk Down Wall Street','Burton G. Malkiel','Money & Investing','Unread',0],['Tax-Free Wealth','Tom Wheelwright','Money & Investing','Unread',0],['Unshakeable','Tony Robbins','Money & Investing','Unread',0],['The Millionaire Next Door','Thomas J. Stanley & William D. Danko','Money & Investing','Finished',0],['The Body Keeps the Score','Bessel van der Kolk','Health & Wellness','Finished',5],['The Laws of Human Nature','Robert Greene','Psychology & Self-Development','Reading',0],['Emotional Intelligence','Daniel Goleman','Psychology & Self-Development','Finished',0],['Social Intelligence','Daniel Goleman','Relationships','Finished',0],['The Untethered Soul','Michael A. Singer','Spirituality & Faith','Finished',5],['The Power of Now','Eckhart Tolle','Spirituality & Faith','Finished',0],['Meditations','Marcus Aurelius','Philosophy & Stoicism','Finished',5],['The Stoic Challenge','William B. Irvine','Philosophy & Stoicism','Unread',0],['Peace Is Every Step','Thich Nhat Hanh','Spirituality & Faith','Finished',0],['When Things Fall Apart','Pema Chödrön','Spirituality & Faith','Unread',0],['Inner Engineering','Sadhguru','Spirituality & Faith','Unread',0],['Conversations with God','Neale Donald Walsch','Spirituality & Faith','Unread',0]];const KEY='my-books-v3';let books=JSON.parse(localStorage.getItem(KEY)||'null')||seed.map((x,i)=>({id:'b'+i,title:x[0],author:x[1],genre:x[2],status:x[3],rating:x[4],notes:'',isbn:'',published:'',pages:'',cover:'',summary:'',addedAt:Date.now()-1000*864e5-i}));let historyStack=[];function save(){localStorage.setItem(KEY,JSON.stringify(books));renderHome()}function nav(id,push=true){let cur=document.querySelector('.screen.active')?.id;if(push&&cur&&cur!==id)historyStack.push(cur);document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')renderHome();if(id==='browse')renderCats();if(id==='search')renderSearch(document.getElementById('searchInput').value)}function goBack(){nav(historyStack.pop()||'home',false)}function card(b){return `<div class="book" onclick="detail('${b.id}')"><img class="cover" src="${b.cover||''}" onerror="this.style.visibility='hidden'"><div class="title">${esc(b.title)}</div><div class="author">${esc(b.author)}</div></div>`}function section(title,list,key,limit){if(!list.length)return '';return `<div class="section"><div class="head"><h2>${title}</h2>${list.length>limit?`<button class="link" onclick="showList('${key}','${title.replaceAll("'","&#39;")}')">See All</button>`:''}</div><div class="${key==='finished'?'grid':'row'}">${list.slice(0,limit).map(card).join('')}</div></div>`}function renderHome(){let reading=books.filter(b=>b.status==='Reading'),recent=books.filter(b=>Date.now()-b.addedAt<30*864e5).sort((a,b)=>b.addedAt-a.addedAt).slice(0,5),five=books.filter(b=>b.rating===5),finished=books.filter(b=>b.status==='Finished');homeSections.innerHTML=section('Currently Reading',reading,'reading',5)+section('Recently Added',recent,'recent',5)+section('5 Star Books',five,'five',5)+section("Books I’ve Read",finished,'finished',6)}function showList(key,title){let l=key==='reading'?books.filter(b=>b.status==='Reading'):key==='recent'?books.filter(b=>Date.now()-b.addedAt<30*864e5):key==='five'?books.filter(b=>b.rating===5):books.filter(b=>b.status==='Finished');listTitle.textContent=title;listGrid.innerHTML=l.map(card).join('');nav('list')}function renderCats(){categories.innerHTML=cats.map(c=>`<div class="cat" onclick="category('${c.replaceAll("'","\\'")}')">${c}<div class="muted" style="font-size:13px;margin-top:4px">${books.filter(b=>b.genre.includes(c)).length} books</div></div>`).join('')}function category(c){listTitle.textContent=c;listGrid.innerHTML=books.filter(b=>b.genre.includes(c)).map(card).join('')||'<p class="empty">No books yet.</p>';nav('list')}function showSearch(q){nav('search');searchInput.value=q;renderSearch(q)}function renderSearch(q){q=q.toLowerCase().trim();let r=q?books.filter(b=>(b.title+' '+b.author+' '+b.genre+' '+b.isbn).toLowerCase().includes(q)):[];searchResults.innerHTML=r.map(b=>`<div>${card(b)}<div class="badge">✓ In Your Library</div></div>`).join('')}function detail(id){let b=books.find(x=>x.id===id);if(!b)return;detailBody.innerHTML=`<img class="detailCover" src="${b.cover||''}"><h2>${esc(b.title)}</h2><div class="muted">${esc(b.author)}</div><div class="muted">${esc(b.genre)}</div><div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="rate('${b.id}',${n})">${n<=b.rating?'★':'☆'}</span>`).join('')}</div><div>${['Unread','Reading','Finished'].map(s=>`<button class="pill ${b.status===s?'on':''}" onclick="statusSet('${b.id}','${s}')">${s}</button>`).join('')}</div><div class="tabs"><button class="on">About</button></div><p>${esc(b.summary||'Book details are being enriched from free book metadata sources. You can edit your private notes and reading information anytime.')}</p><p><b>ISBN:</b> ${esc(b.isbn||'—')}<br><b>Published:</b> ${esc(b.published||'—')}<br><b>Pages:</b> ${esc(String(b.pages||'—'))}</p><textarea class="field notes" placeholder="Private notes" onchange="note('${b.id}',this.value)">${esc(b.notes)}</textarea><button class="primary danger" onclick="removeBook('${b.id}')">Delete Book</button>`;nav('detail');enrich(b)}function rate(id,n){let b=books.find(x=>x.id===id);b.rating=b.rating===n?0:n;save();detail(id);historyStack.pop()}function statusSet(id,s){books.find(x=>x.id===id).status=s;save();detail(id);historyStack.pop()}function note(id,v){books.find(x=>x.id===id).notes=v;save()}function removeBook(id){if(confirm('Delete this book?')){books=books.filter(x=>x.id!==id);save();nav('home')}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function enrich(b){if(b.cover&&b.isbn)return;try{let u='https://openlibrary.org/search.json?limit=1&title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author);let j=await fetch(u).then(r=>r.json()),d=j.docs?.[0];if(d){b.cover=d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg':b.cover;b.isbn=(d.isbn||[]).find(x=>x.length===13)||(d.isbn||[])[0]||b.isbn;b.published=d.first_publish_year||b.published;b.pages=d.number_of_pages_median||b.pages;save();let img=document.querySelector('.detailCover');if(img&&b.cover)img.src=b.cover}}catch(e){}}async function addBook(){let title=aTitle.value.trim(),author=aAuthor.value.trim(),genre=aGenre.value.trim()||'Literary Fiction',isbn=aIsbn.value.trim();if(!title&&!isbn)return alert('Enter a title or ISBN.');let dup=books.find(b=>(isbn&&b.isbn===isbn)||(title&&author&&b.title.toLowerCase()===title.toLowerCase()&&b.author.toLowerCase()===author.toLowerCase()));if(dup)return alert('This book is already in your library.');let b={id:crypto.randomUUID(),title:title||'New Book',author,genre,status:'Unread',rating:0,notes:'',isbn,published:'',pages:'',cover:'',summary:'',addedAt:Date.now()};books.unshift(b);save();await enrich(b);aTitle.value=aAuthor.value=aGenre.value=aIsbn.value='';detail(b.id)}function backup(){let blob=new Blob([JSON.stringify({version:3,books},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-books-backup.json';a.click()}function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);books=x.books||x;if(!Array.isArray(books))throw 0;save();nav('home');alert('Library restored.')}catch(e){alert('That backup could not be restored.')}};r.readAsText(f)}renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');setTimeout(()=>books.slice(0,12).forEach(enrich),500);</script></body></html>
